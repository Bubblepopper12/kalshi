# Runs `picks research` on GitHub's servers (they can reach Kalshi and the odds archives) every
# morning, then saves the reports to research/reports. Vercel redeploys on that commit, so the
# website's Research tab updates by itself. Run it anytime: Actions → Research → Run workflow.
# Downloaded prices are kept in GitHub's cache, so each run only fetches games finished since the last.
name: Research

on:
  schedule:
    - cron: "47 10 * * *"  # every day, ~5:47 AM Central (GitHub may start it a little late)
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues (comma-separated, blank = all)"
        required: false
        default: ""
      since:
        description: "First day of games (YYYY-MM-DD)"
        required: false
        default: "2025-08-01"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . tzdata
      - name: Bring back the prices downloaded on earlier runs
        uses: actions/cache@v4
        with:
          path: research/data
          key: research-data-v2-${{ github.run_id }}
          restore-keys: research-data-v2-  # bump v2 to start over (e.g. after a price-format fix)
      - name: Git identity for saving results
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
      - name: Run every test for every league (each league is saved as soon as it's done)
        env:
          LEAGUES: ${{ github.event.inputs.leagues }}
          SINCE: ${{ github.event.inputs.since || '2025-08-01' }}
        run: picks research --since "$SINCE" ${LEAGUES:+--leagues "$LEAGUES"} --publish 'scripts/save_reports.sh "$1"'

      - name: Keep a copy of the reports with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reports
          path: research/reports
          if-no-files-found: ignore
      - name: Save anything left over
        run: scripts/save_reports.sh
