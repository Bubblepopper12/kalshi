[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picks-engine"
version = "0.2.0"
description = "Kalshi Picks Engine: grades tipsters, prices picks against Kalshi, and places only orders you approve."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
board = ["streamlit>=1.35", "pandas>=2.1"]
trading = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
picks = "picks_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
